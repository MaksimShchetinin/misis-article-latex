name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    # Times New Roman и Courier New уже есть в образе Windows.
    # На ubuntu-latest их нет, и класс уходит в запасной TeX Gyre.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Require Times New Roman and Courier New
        id: fonts
        run: |
          mkdir -p .ci-fontcheck
          cat > .ci-fontcheck/fontcheck.tex << 'EOF'
          \documentclass{article}
          \usepackage{fontspec}
          \usepackage{polyglossia}
          \setdefaultlanguage{russian}
          \IfFontExistsTF{Times New Roman}{}{%
            \PackageError{fontcheck}{Times New Roman is not installed}{}%
          }
          \IfFontExistsTF{Courier New}{}{%
            \PackageError{fontcheck}{Courier New is not installed}{}%
          }
          \setmainfont{Times New Roman}[
            Ligatures=TeX,
            BoldFont={Times New Roman Bold},
            ItalicFont={Times New Roman Italic},
            BoldItalicFont={Times New Roman Bold Italic},
          ]
          \newfontfamily\cyrillicfont{Times New Roman}[
            Ligatures=TeX,
            BoldFont={Times New Roman Bold},
            ItalicFont={Times New Roman Italic},
            BoldItalicFont={Times New Roman Bold Italic},
          ]
          \newfontfamily\cyrillicfonttt{Courier New}
          \begin{document}
          Проверка \textbf{жирный} \textit{курсив} \texttt{абв}
          \end{document}
          EOF
          tectonic -o .ci-fontcheck .ci-fontcheck/fontcheck.tex

      - name: Build template
        run: mkdir -p build && tectonic -o build article.tex

      - name: Build example
        if: always() && steps.fonts.outcome == 'success'
        working-directory: example
        run: |
          rm -f misisarticle.cls
          cp ../misisarticle.cls misisarticle.cls
          mkdir -p build
          tectonic -o build example.tex

      - name: Upload article PDF
        if: always() && steps.fonts.outcome == 'success' && hashFiles('build/article.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          path: build/article.pdf
          archive: false

      - name: Upload example PDF
        if: always() && steps.fonts.outcome == 'success' && hashFiles('example/build/example.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          path: example/build/example.pdf
          archive: false

  research:
    name: Build research article (XeLaTeX)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4.1.1
        with:
          packages: |
            scheme-small
            collection-xetex
            hyphen-russian
            caption
            enumitem
            microtype
            setspace
            titlesec
            xurl

      - name: Compile news-stability.tex
        working-directory: github_article
        run: |
          mkdir -p build/research
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build/research article/news-stability.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build/research article/news-stability.tex

      - name: Upload research article PDF
        uses: actions/upload-artifact@v7
        with:
          path: github_article/build/research/news-stability.pdf
          archive: false
          if-no-files-found: error
